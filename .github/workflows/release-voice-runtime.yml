name: Voice runtime qualified release
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Compose pre-tag truth or publish its exact successful bytes
        type: choice
        options: [pretag, publish]
        required: true
      release_tag:
        description: Intended immutable tag (vX.Y.Z)
        required: true
      runtime_version:
        description: Runtime version (X.Y.Z)
        required: true
      pretag_run_id:
        description: Exact successful pretag workflow run ID (publish only)
        required: false
permissions:
  contents: write
  actions: read
env:
  VOICE_RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
  VOICE_RUNTIME_VERSION_INPUT: ${{ inputs.runtime_version }}
concurrency:
  group: voice-runtime-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  pretag:
    if: inputs.operation == 'pretag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Resolve exact committed candidate pointer
        id: candidate
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          test "$VOICE_RUNTIME_VERSION_INPUT" = 1.0.0
          test "$VOICE_RELEASE_TAG_INPUT" = v1.0.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git tag -l -- "$VOICE_RELEASE_TAG_INPUT")"
          RECORD=release/candidates/v1.0.0.json
          test -f "$RECORD"
          RUN_ID=$(jq -r .workflow.runId "$RECORD")
          HEAD_SHA=$(jq -r .workflow.headSha "$RECORD")
          ARTIFACT_ID=$(jq -r .artifact.id "$RECORD")
          ARTIFACT_NAME=$(jq -r .artifact.name "$RECORD")
          test "$(jq -r .workflow.path "$RECORD")" = .github/workflows/promote-qualified-voice-candidate.yml
          test "$(jq -r .workflow.conclusion "$RECORD")" = success
          printf 'run_id=%s\nhead_sha=%s\nartifact_id=%s\nartifact_name=%s\n' \
            "$RUN_ID" "$HEAD_SHA" "$ARTIFACT_ID" "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          RUN=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          test "$(jq -r .path <<<"$RUN")" = .github/workflows/promote-qualified-voice-candidate.yml
          test "$(jq -r .conclusion <<<"$RUN")" = success
          test "$(jq -r .head_sha <<<"$RUN")" = "$HEAD_SHA"
          ARTIFACT=$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          test "$(jq -r .workflow_run.id <<<"$ARTIFACT")" = "$RUN_ID"
          test "$(jq -r .name <<<"$ARTIFACT")" = "$ARTIFACT_NAME"
          test "$(jq -r .expired <<<"$ARTIFACT")" = false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          path: candidate
      - name: Verify candidate applicability and compose immutable pre-tag chain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check:release-pipeline
          mkdir -p bundle/assets
          node release/qualified-release-candidate.mjs --operation verify --candidate candidate
          node release/assess-qualified-candidate.mjs --candidate candidate \
            --promotion-record release/candidates/v1.0.0.json \
            --final-main-commit "$GITHUB_SHA" \
            --output bundle/release-candidate-applicability-v1.json
          node release/evidence/assemble.mjs --candidate candidate \
            --promotion-record release/candidates/v1.0.0.json \
            --applicability bundle/release-candidate-applicability-v1.json \
            --runtime-version "$VOICE_RUNTIME_VERSION_INPUT" \
            --release-tag "$VOICE_RELEASE_TAG_INPUT" \
            --maintained-main-commit "$GITHUB_SHA" \
            --output bundle/release-qualification-evidence-v2.json
          node release/catalog-builder.mjs --candidate candidate \
            --release-evidence bundle/release-qualification-evidence-v2.json \
            --release-tag "$VOICE_RELEASE_TAG_INPUT" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --output bundle/voice-runtime-catalog-v3.json
          node release/pretag-release-manifest.mjs --candidate candidate \
            --release-evidence bundle/release-qualification-evidence-v2.json \
            --catalog bundle/voice-runtime-catalog-v3.json \
            --output bundle/pretag-release-manifest-v2.json
          node release/qualify-release.mjs --candidate candidate \
            --promotion-record release/candidates/v1.0.0.json \
            --applicability bundle/release-candidate-applicability-v1.json \
            --manifest bundle/pretag-release-manifest-v2.json \
            --release-evidence bundle/release-qualification-evidence-v2.json \
            --catalog bundle/voice-runtime-catalog-v3.json \
            --maintained-main-commit "$GITHUB_SHA" \
            --output bundle/pretag-qualification-proof-v1.json
          cp candidate/assets/*.zip bundle/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: pretag-voice-runtime-${{ inputs.release_tag }}-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  publish:
    if: inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Resolve exact successful pretag and candidate artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$VOICE_RUNTIME_VERSION_INPUT" = 1.0.0
          test "$VOICE_RELEASE_TAG_INPUT" = v1.0.0
          [[ "${{ inputs.pretag_run_id }}" =~ ^[1-9][0-9]*$ ]]
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git tag -l -- "$VOICE_RELEASE_TAG_INPUT")"
          RUN=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.pretag_run_id }}")
          test "$(jq -r .path <<<"$RUN")" = .github/workflows/release-voice-runtime.yml
          test "$(jq -r .conclusion <<<"$RUN")" = success
          test "$(jq -r .head_sha <<<"$RUN")" = "$GITHUB_SHA"
          PRETAG_NAME="pretag-voice-runtime-$VOICE_RELEASE_TAG_INPUT-$GITHUB_SHA"
          mapfile -t PRETAG_IDS < <(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.pretag_run_id }}/artifacts" --jq ".artifacts[]|select(.name==\"$PRETAG_NAME\" and .expired==false)|.id")
          test "${#PRETAG_IDS[@]}" = 1
          PRETAG_ID=${PRETAG_IDS[0]}
          RECORD=release/candidates/v1.0.0.json
          CANDIDATE_ID=$(jq -r .artifact.id "$RECORD")
          CANDIDATE_RUN=$(jq -r .workflow.runId "$RECORD")
          CANDIDATE=$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ID")
          test "$(jq -r .workflow_run.id <<<"$CANDIDATE")" = "$CANDIDATE_RUN"
          test "$(jq -r .name <<<"$CANDIDATE")" = "$(jq -r .artifact.name "$RECORD")"
          test "$(jq -r .expired <<<"$CANDIDATE")" = false
          node - "$RECORD" "$GITHUB_OUTPUT" "$PRETAG_ID" <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[2]));
          const rows={pretag_id:process.argv[4],candidate_id:r.artifact.id,candidate_run:r.workflow.runId};
          for(const [k,v] of Object.entries(rows))fs.appendFileSync(process.argv[3],`${k}=${v}\n`);
          NODE
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifacts.outputs.pretag_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pretag_run_id }}
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifacts.outputs.candidate_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifacts.outputs.candidate_run }}
          path: candidate
      - name: Reverify exact pre-tag bytes, tag, and publish five files
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check:release-pipeline
          node release/qualify-release.mjs --candidate candidate \
            --promotion-record release/candidates/v1.0.0.json \
            --applicability bundle/release-candidate-applicability-v1.json \
            --manifest bundle/pretag-release-manifest-v2.json \
            --release-evidence bundle/release-qualification-evidence-v2.json \
            --catalog bundle/voice-runtime-catalog-v3.json \
            --maintained-main-commit "$GITHUB_SHA" \
            --output bundle/publication-recheck.json
          git tag -a "$VOICE_RELEASE_TAG_INPUT" "$GITHUB_SHA" -m "Voice runtime $VOICE_RELEASE_TAG_INPUT"
          git push origin "refs/tags/$VOICE_RELEASE_TAG_INPUT"
          gh release create "$VOICE_RELEASE_TAG_INPUT" bundle/assets/*.zip \
            bundle/voice-runtime-catalog-v3.json \
            bundle/release-qualification-evidence-v2.json \
            bundle/pretag-release-manifest-v2.json --verify-tag \
            --title "Voice runtime $VOICE_RELEASE_TAG_INPUT — macOS Apple Silicon only" \
            --notes "Provider Archive 1 packages for macOS Apple Silicon only."
      - name: Download every published byte
        id: download
        if: always() && steps.publish.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p published
          gh release download "$VOICE_RELEASE_TAG_INPUT" --dir published
      - name: Always record published-byte verification
        id: verify
        if: always() && steps.publish.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          node release/verify-published-assets.mjs \
            --manifest bundle/pretag-release-manifest-v2.json \
            --downloads published --repository "$GITHUB_REPOSITORY" \
            --release-tag "$VOICE_RELEASE_TAG_INPUT" \
            --output bundle/published-asset-verification-v1.json
      - name: Quarantine failed publication without changing its tag
        id: quarantine
        if: always() && steps.verify.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          node release/quarantine-published-release.mjs \
            --verification bundle/published-asset-verification-v1.json \
            --release-tag "$VOICE_RELEASE_TAG_INPUT" \
            --repository "$GITHUB_REPOSITORY" \
            --output bundle/publication-quarantine-result-v1.json
      - name: Retain post-publication audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-audit-${{ inputs.release_tag }}-${{ github.sha }}
          path: |
            bundle/published-asset-verification-v1.json
            bundle/publication-quarantine-result-v1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Fail finalization after verification or quarantine failure
        if: always() && steps.publish.outcome != 'skipped'
        shell: bash
        run: |
          test "${{ steps.publish.outcome }}" = success
          test "${{ steps.verify.outcome }}" = success
          test "${{ steps.quarantine.outcome }}" = skipped
