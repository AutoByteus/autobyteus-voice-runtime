name: Voice runtime pre-tag qualification and publication
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prequalify first; publish only a successful prequalification run
        type: choice
        options: [prequalify, publish]
        required: true
      release_tag:
        description: Intended immutable release tag (vX.Y.Z)
        required: true
      runtime_version:
        description: Runtime version (X.Y.Z)
        required: true
      qualification_run_id:
        description: Required only for publish; completed prequalify workflow run ID
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: voice-runtime-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  build-and-qualify:
    if: inputs.operation == 'prequalify'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              profile: english,
              target: darwin-arm64,
              runner: [self-hosted, macOS, ARM64, voice-m1-max],
            }
          - {
              profile: chinese,
              target: darwin-arm64,
              runner: [self-hosted, macOS, ARM64, voice-m1-max],
            }
          - {
              profile: english,
              target: darwin-x64,
              runner: [self-hosted, macOS, X64, voice-runtime],
            }
          - {
              profile: chinese,
              target: darwin-x64,
              runner: [self-hosted, macOS, X64, voice-runtime],
            }
          - {
              profile: english,
              target: linux-x64,
              runner: [self-hosted, Linux, X64, voice-runtime],
            }
          - {
              profile: chinese,
              target: linux-x64,
              runner: [self-hosted, Linux, X64, voice-runtime],
            }
          - {
              profile: english,
              target: win32-x64,
              runner: [self-hosted, Windows, X64, voice-runtime],
            }
          - {
              profile: chinese,
              target: win32-x64,
              runner: [self-hosted, Windows, X64, voice-runtime],
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify pinned build environment
        shell: bash
        run: |
          test "$(node --version)" = v22.23.1
          test "$($VOICE_GO version | awk '{print $3}')" = go1.26.5
          npm ci --ignore-scripts
      - name: Build exact profile archive
        shell: bash
        run: |
          mkdir -p out/qualifications/${{ matrix.profile }}-${{ matrix.target }} out/assets
          ARCHIVE=voice-${{ matrix.profile }}-${{ matrix.target }}-${{ inputs.runtime_version }}.zip
          node build/package-assembler.mjs \
            --profile ${{ matrix.profile }} --target ${{ matrix.target }} \
            --inputs "$VOICE_BUILD_INPUT_ROOT/${{ matrix.profile }}/${{ matrix.target }}" \
            --output "out/assets/$ARCHIVE" --go "$VOICE_GO" --cmake "$VOICE_CMAKE" \
            --source-commit "$GITHUB_SHA" --version "${{ inputs.runtime_version }}"
          node build/package-verifier.mjs --archive "out/assets/$ARCHIVE" \
            --build-report "out/assets/$ARCHIVE.build.json" --go "$VOICE_GO" \
            --output "out/qualifications/${{ matrix.profile }}-${{ matrix.target }}/package-verification.json"
          REBUILD_DIR="$RUNNER_TEMP/voice-rebuild-${{ matrix.profile }}-${{ matrix.target }}"
          mkdir -p "$REBUILD_DIR"
          node build/package-assembler.mjs \
            --profile ${{ matrix.profile }} --target ${{ matrix.target }} \
            --inputs "$VOICE_BUILD_INPUT_ROOT/${{ matrix.profile }}/${{ matrix.target }}" \
            --output "$REBUILD_DIR/$ARCHIVE" --go "$VOICE_GO" --cmake "$VOICE_CMAKE" \
            --source-commit "$GITHUB_SHA" --version "${{ inputs.runtime_version }}"
          node build/verify-reproducibility.mjs \
            --first-archive "out/assets/$ARCHIVE" --first-report "out/assets/$ARCHIVE.build.json" \
            --second-archive "$REBUILD_DIR/$ARCHIVE" --second-report "$REBUILD_DIR/$ARCHIVE.build.json" \
            --output "out/qualifications/${{ matrix.profile }}-${{ matrix.target }}/reproducibility-proof-v1.json"
          rm -rf "$REBUILD_DIR"
      - name: Execute actual-package qualification
        shell: bash
        run: |
          ARCHIVE=voice-${{ matrix.profile }}-${{ matrix.target }}-${{ inputs.runtime_version }}.zip
          CONDITIONS=out/qualifications/${{ matrix.profile }}-${{ matrix.target }}/conditions-input.json
          node benchmark/prepare-conditions.mjs \
            --source-commit "$GITHUB_SHA" --runner-commit "$GITHUB_SHA" \
            --profile ${{ matrix.profile }} --target ${{ matrix.target }} \
            --evidence "$VOICE_EVIDENCE_ROOT/${{ matrix.profile }}/${{ matrix.target }}" \
            --output "$CONDITIONS"
          EXTRA="--cold-count 3 --warm-count 10"
          if test "${{ matrix.target }}" = darwin-arm64; then EXTRA="--cold-count 30 --warm-count 100"; fi
          node benchmark/run-profile-qualification.mjs \
            --archive "out/assets/$ARCHIVE" --build-report "out/assets/$ARCHIVE.build.json" \
            --corpus "$VOICE_CORPUS_ROOT/${{ matrix.profile }}/corpus-v1.json" \
            --baseline "$VOICE_CORPUS_ROOT/${{ matrix.profile }}/baseline-evidence.json" \
            --conditions "$CONDITIONS" --go "$VOICE_GO" \
            --reproducibility-proof "out/qualifications/${{ matrix.profile }}-${{ matrix.target }}/reproducibility-proof-v1.json" \
            --output "out/qualifications/${{ matrix.profile }}-${{ matrix.target }}" $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-${{ matrix.profile }}-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  aggregate-pretag:
    if: inputs.operation == 'prequalify'
    needs: build-and-qualify
    runs-on: [self-hosted, Linux, X64, voice-release]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          pattern: qualified-*
          path: bundle
          merge-multiple: true
      - name: Recompute release evidence before any tag
        shell: bash
        run: |
          test "$(node --version)" = v22.23.1
          npm ci --ignore-scripts
          git fetch origin main --tags
          test -z "$(git tag -l '${{ inputs.release_tag }}')"
          node release/catalog-builder.mjs --qualifications bundle/qualifications \
            --release-tag "${{ inputs.release_tag }}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release_tag }}" \
            --output bundle/voice-runtime-catalog-v3.json
          node release/evidence/assemble.mjs --qualifications bundle/qualifications \
            --catalog bundle/voice-runtime-catalog-v3.json --assets bundle/assets \
            --maintained-main-commit "$(git rev-parse origin/main)" \
            --output bundle/release-qualification-evidence-v1.json
          node release/qualify-release.mjs --evidence bundle/release-qualification-evidence-v1.json \
            --catalog bundle/voice-runtime-catalog-v3.json --qualifications bundle/qualifications \
            --assets bundle/assets --output bundle/pretag-qualification-proof-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: pretag-voice-runtime-${{ inputs.release_tag }}
          path: bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish-qualified:
    if: inputs.operation == 'publish'
    runs-on: [self-hosted, Linux, X64, voice-release]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Download the completed pre-tag artifact
        shell: bash
        run: |
          test -n "${{ inputs.qualification_run_id }}"
          META=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.qualification_run_id }}")
          test "$(node -e 'let x=JSON.parse(process.argv[1]);process.stdout.write(x.conclusion)' "$META")" = success
          test "$(node -e 'let x=JSON.parse(process.argv[1]);process.stdout.write(x.head_sha)' "$META")" = "$GITHUB_SHA"
          mkdir bundle
          gh run download "${{ inputs.qualification_run_id }}" --name "pretag-voice-runtime-${{ inputs.release_tag }}" --dir bundle
      - name: Reverify, then tag and publish exact qualified bytes
        shell: bash
        run: |
          test "$(node --version)" = v22.23.1
          npm ci --ignore-scripts
          git fetch origin main --tags
          test -z "$(git tag -l '${{ inputs.release_tag }}')"
          node release/qualify-release.mjs --evidence bundle/release-qualification-evidence-v1.json \
            --catalog bundle/voice-runtime-catalog-v3.json --qualifications bundle/qualifications \
            --assets bundle/assets --output bundle/publication-recheck.json
          git tag -a "${{ inputs.release_tag }}" "$GITHUB_SHA" -m "Voice runtime ${{ inputs.release_tag }}"
          git push origin "refs/tags/${{ inputs.release_tag }}"
          gh release create "${{ inputs.release_tag }}" bundle/assets/*.zip \
            bundle/voice-runtime-catalog-v3.json bundle/release-qualification-evidence-v1.json \
            --verify-tag --title "Voice runtime ${{ inputs.release_tag }}" \
            --notes "Independently executable Provider Archive 1 profile packages."
          mkdir published
          gh release download "${{ inputs.release_tag }}" --dir published
          node release/verify-published-assets.mjs --catalog bundle/voice-runtime-catalog-v3.json \
            --evidence bundle/release-qualification-evidence-v1.json --assets published \
            --output bundle/publication-verification.json
