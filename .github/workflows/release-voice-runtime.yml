name: Voice runtime host release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        { description: Exact immutable tag, required: true, default: v1.0.0 }
      runtime_version:
        { description: Exact runtime version, required: true, default: 1.0.0 }
permissions: { contents: write, actions: read }
concurrency: { group: voice-runtime-host-v1.0.0, cancel-in-progress: false }
env:
  VOICE_RELEASE_TAG: ${{ inputs.release_tag }}
  VOICE_RUNTIME_VERSION: ${{ inputs.runtime_version }}
jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out exact maintained-main source
        id: checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Initialize truthful hosted release audit
        id: audit_init
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/voice-release"
          mkdir -p "$ROOT"/{cache,inputs,assets,bundle,audit,tools}
          node release/hosted-release-audit.mjs initialize \
            --output "$ROOT/audit/hosted-release-audit-v1.json" \
            --repository "$GITHUB_REPOSITORY" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-checkout-commit "$GITHUB_SHA" --runner-label macos-26 \
            --release-tag "$VOICE_RELEASE_TAG" --runtime-version "$VOICE_RUNTIME_VERSION"
      - name: Select exact Node runtime
        id: setup_node
        uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: npm }
      - name: Select exact Go runtime
        id: setup_go
        uses: actions/setup-go@v5
        with: { go-version: 1.26.5, cache: false }
      - name: Verify source and committed admission
        id: source_admission
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          test "$VOICE_RUNTIME_VERSION" = 1.0.0
          test "$VOICE_RELEASE_TAG" = v1.0.0
          test "$(node --version)" = v22.23.1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git tag -l -- "$VOICE_RELEASE_TAG")"
          ! gh release view "$VOICE_RELEASE_TAG" >/dev/null 2>&1
          npm ci --ignore-scripts
          npm run check:release-pipeline
          node release/verify-release-source-admission.mjs --repository "$GITHUB_WORKSPACE" \
            --workflow-checkout-commit "$GITHUB_SHA" --mode lineage
      - name: Select exact hosted Xcode SDK and CMake toolchain
        id: hosted_toolchain
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/voice-release"
          CMAKE="$(node release/hosted-toolchain.mjs --tools-root "$ROOT/tools" \
            --runner-label macos-26 \
            --output "$ROOT/audit/hosted-toolchain-selection-v1.json")"
          printf 'cmake=%s\n' "$CMAKE" >> "$GITHUB_OUTPUT"
      - name: Capture hosted authority and hydrate host-only inputs
        id: input_hydration
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/voice-release"
          CMAKE="${{ steps.hosted_toolchain.outputs.cmake }}"
          node build/host-build-environment.mjs --cmake "$CMAKE" \
            --runner-label macos-26 --output "$ROOT/host-build-environment-v2.json"
          node build/hydrate-host-input-cache.mjs \
            --english build/input-recipes/english-host-darwin-arm64-v2.json \
            --chinese build/input-recipes/chinese-host-darwin-arm64-v2.json --cache "$ROOT/cache"
          for PROFILE in english chinese; do
            node build/materialize-release-inputs.mjs \
              --recipe "build/input-recipes/${PROFILE}-host-darwin-arm64-v2.json" \
              --cache "$ROOT/cache" --repository "$GITHUB_WORKSPACE" \
              --destination "$ROOT/inputs/$PROFILE" --source-commit "$GITHUB_SHA"
          done
      - name: Build and independently verify exact runtime hosts
        id: host_construction
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/voice-release"; GO="$(go env GOROOT)/bin/go"
          /usr/bin/sandbox-exec -f benchmark/sandbox/darwin-arm64-network-denied-v1.sb \
            "$(command -v node)" release/run-host-construction.mjs \
            --source-admission release/admission/v1.0.0-release-source-admission-v4.json \
            --release-admission-verification "$ROOT/audit/release-admission-verification-v1.json" \
            --qualification-set release/admission/v1.0.0-focused-qualification-set-v3.json \
            --workflow-checkout-commit "$GITHUB_SHA" --inputs-root "$ROOT/inputs" \
            --assets "$ROOT/assets" --audit "$ROOT/audit" --go "$GO" \
            --build-environment "$ROOT/host-build-environment-v2.json" \
            --version "$VOICE_RUNTIME_VERSION" \
            --output "$ROOT/audit/hosted-host-construction-result-v3.json"
      - name: Compose exact acyclic nine-asset bundle
        id: release_composition
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/voice-release"; AUTH=release/admission
          node release/model-manifest-admission.mjs \
            --source-admission "$AUTH/v1.0.0-release-source-admission-v4.json" \
            --branch-projection "$AUTH/v1.0.0-branch-catalog-projection-v3.json" \
            --english-execution-closure "$AUTH/v1.0.0-english-profile-execution-closure-v2.json" \
            --chinese-execution-closure "$AUTH/v1.0.0-chinese-profile-execution-closure-v2.json" \
            --output "$ROOT/audit/model-manifest-admission-v1.json"
          cp release/model-manifests/*.json THIRD_PARTY_NOTICES.json "$ROOT/bundle/"
          cp "$ROOT/assets"/*.zip "$ROOT/bundle/"
          node release/evidence/assemble.mjs \
            --source-admission "$AUTH/v1.0.0-release-source-admission-v4.json" \
            --release-admission-verification "$ROOT/audit/release-admission-verification-v1.json" \
            --host-construction "$ROOT/audit/hosted-host-construction-result-v3.json" \
            --model-manifest-admission "$ROOT/audit/model-manifest-admission-v1.json" \
            --branch-projection "$AUTH/v1.0.0-branch-catalog-projection-v3.json" \
            --final-main-commit "$GITHUB_SHA" --output "$ROOT/bundle/release-qualification-evidence-v4.json"
          node release/catalog-builder.mjs \
            --release-evidence "$ROOT/bundle/release-qualification-evidence-v4.json" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --output "$ROOT/bundle/voice-runtime-catalog-v4.json"
          node release/pretag-release-manifest.mjs --final-main-commit "$GITHUB_SHA" \
            --release-evidence "$ROOT/bundle/release-qualification-evidence-v4.json" \
            --catalog "$ROOT/bundle/voice-runtime-catalog-v4.json" \
            --english-host "$ROOT/bundle/voice-host-english-darwin-arm64-1.0.0.zip" \
            --chinese-host "$ROOT/bundle/voice-host-chinese-darwin-arm64-1.0.0.zip" \
            --english-model-manifest "$ROOT/bundle/voice-model-english-whisper-small-mlx-fp16-v1.json" \
            --chinese-model-manifest "$ROOT/bundle/voice-model-chinese-fun-asr-nano-gguf-q8-v1.json" \
            --notices "$ROOT/bundle/THIRD_PARTY_NOTICES.json" \
            --output "$ROOT/bundle/pretag-release-manifest-v4.json"
          node release/release-checksums.mjs --directory "$ROOT/bundle" \
            --output "$ROOT/bundle/release-SHA256SUMS.txt"
          node release/prepublication-seal.mjs --directory "$ROOT/bundle" \
            --output "$ROOT/audit/prepublication-seal-v1.json"
      - name: Tag and publish exact sealed bytes
        id: publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/voice-release"
          git tag -a "$VOICE_RELEASE_TAG" "$GITHUB_SHA" -m "Voice runtime hosts $VOICE_RELEASE_TAG"
          git push origin "refs/tags/$VOICE_RELEASE_TAG"
          FILES=("$ROOT/bundle"/*)
          test "${#FILES[@]}" = 9
          gh release create "$VOICE_RELEASE_TAG" "${FILES[@]}" --verify-tag \
            --title "Voice runtime hosts $VOICE_RELEASE_TAG — macOS Apple Silicon" \
            --notes "Host-only runtimes; install an admitted model explicitly."
      - name: Download and verify all published bytes
        id: verify
        if: always() && steps.publish.outcome != 'skipped'
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/voice-release"; mkdir "$ROOT/published"
          gh release download "$VOICE_RELEASE_TAG" --dir "$ROOT/published"
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$VOICE_RELEASE_TAG" \
            | jq '{releaseId:.id,assets:[.assets[]|{name,id}]}' > "$ROOT/audit/published-assets.json"
          node release/verify-published-assets.mjs \
            --seal "$ROOT/audit/prepublication-seal-v1.json" --downloads "$ROOT/published" \
            --asset-metadata "$ROOT/audit/published-assets.json" \
            --repository "$GITHUB_REPOSITORY" --release-tag "$VOICE_RELEASE_TAG" \
            --output "$ROOT/audit/published-asset-verification-v2.json"
      - name: Quarantine failed publication without changing its tag
        id: quarantine
        if: always() && steps.verify.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          node release/quarantine-published-release.mjs \
            --verification "$RUNNER_TEMP/voice-release/audit/published-asset-verification-v2.json" \
            --release-tag "$VOICE_RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/voice-release/audit/publication-quarantine-result-v1.json"
      - name: Finalize truthful hosted release audit
        id: audit_finalize
        if: always() && steps.audit_init.outcome == 'success'
        run: |
          set -euo pipefail
          AUDIT="$RUNNER_TEMP/voice-release/audit/hosted-release-audit-v1.json"
          node release/hosted-release-audit.mjs finalize --input "$AUDIT" --output "$AUDIT" \
            --checkout "${{ steps.checkout.outcome }}" \
            --setup-node "${{ steps.setup_node.outcome }}" \
            --setup-go "${{ steps.setup_go.outcome }}" \
            --source-admission "${{ steps.source_admission.outcome }}" \
            --hosted-toolchain "${{ steps.hosted_toolchain.outcome }}" \
            --input-hydration "${{ steps.input_hydration.outcome }}" \
            --host-construction "${{ steps.host_construction.outcome }}" \
            --release-composition "${{ steps.release_composition.outcome }}" \
            --publication "${{ steps.publish.outcome }}" \
            --postpublication-verification "${{ steps.verify.outcome }}" \
            --quarantine "${{ steps.quarantine.outcome }}"
      - name: Retain release audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-runtime-host-release-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/voice-release/audit/
          if-no-files-found: error
          retention-days: 90
      - name: Fail finalization after publication or verification failure
        if: always()
        run: |
          test "${{ steps.publish.outcome }}" = success
          test "${{ steps.verify.outcome }}" = success
